# Fly.io deployment: `fly launch --no-deploy --copy-config`, then `fly volumes create glassballot_data --size 1`, then `fly deploy`.
app = "glassballot"
primary_region = "bom"

[build]

[env]
  PYTHONUNBUFFERED = "1"

[mounts]
  source = "glassballot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Elections, admin/trustee tokens and keys live in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/state"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
